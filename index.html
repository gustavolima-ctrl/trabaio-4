<!DOCTYPE html>
<html lang="pt-BR
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario </title>
    <link rel="stylesheet" href="steyle.css">
</head>
<body>
    <main class="campo">
      <h1>Cadastro do peixe nauta: </h1>  
      <img class="imagem" src="clker-free-vector-images-swordfish-295149.svg" alt="imagem de peixe" width="100px" height="100px">
      <form>
        <div class="inserir">
            <label for="nome">nome:</label>
            <input type="text" id="nome" name="nome"
            placeholder="escreve nome de usuario" required>
        </div>
        <div class="inserir">
            <label for="email">E-mail:</label>
            <input type="email " id="email" name="email"
            placeholder="ecreva email: " required>
        </div>
        <div class="inserir">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha"
            placeholder="escreva senha: " required>
        </div>
        <div class="inserir">
            <label for="data de nascimento">Data de nascimento:</label>
            <input type="date" id="data de nascimento" name="data de nascimento"
            placeholder="selecione a data de nascimento: " required>
        </div>
        <div class="inserir">
            <label for="curso">Curso:</label>
            <select id="curso" name="curso" required>
                <option value="">Selecione um curso</option>
                <option value="informatica">informática</option>
                <option value="veterinaria">Veterinária</option>
                <option value="enfermagem">enfermagem</option>
            </select>
        </div>
        <fieldset class="inserir">
            <legend>Sexo:</legend>
            <div class="escolha">
            <label for="Masculino">Masculino</label>
            <input type="radio" id="Masculino" name="sexo"
            value="masculino" required>
            </div>
            <div class="escolha">
            <label for="feminino">Feminino</label>
            <input type="radio" id="feminino" name="sexo"
            value="feminino" required>
            </div>
        </fieldset>

      <fieldset class="inserir">
        
        <legend>interesses </legend>
        <div class="escolha">
        <label for="esportes">Esportes</label>
        <input type="checkbox" id="esportes" name="hobbies" value="esportes">
        </div>  
        <div class="escolha">
        <label for="musica">Música</label> 
        <input type="checkbox" id="musica" name="hobbies" value="musica">
        </div>
        <div class="escolha">
        <label for="leitura">Leitura</label>
        <input type="checkbox" id="leitura" name="hobbies" value="leitura">
        </div>
        </fieldset>
        <div class="inserir">
            <label for="comebtario">comentario:</label>
            <input type="text" id="comebtario" name="comebtario" placeholder="escreva seu comentario">
        </div>
    <form class="inserir">
        <label for="arquivo">Arquivo foto :</label>
        <input type="file" id="arquivo" name="arquivo" accept="image/*">
    </form>
    </main>

    
</body>
</html>
